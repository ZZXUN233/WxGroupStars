services:
  group-stars-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-group-stars-api}:${IMAGE_TAG:-latest}
    container_name: group-stars-api
    env_file:
      - ./backend/.env
    ports:
      - "${API_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s