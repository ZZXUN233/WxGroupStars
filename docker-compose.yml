services:
  group-stars-api:
    image: ${IMAGE_REGISTRY:-zzxun.cn:5000}/group-stars-api:${IMAGE_TAG:-latest}
    container_name: group-stars-api
    # 服务器部署前创建 backend/.env，至少配置 DATABASE_URL。
    # 例如：mysql://root:password@mysql-host:3306/wgs
    env_file:
      - ./backend/.env
    ports:
      - "${API_PORT:-3000}:3000"
    # 支持数据库运行在 Docker 宿主机（本地 WSL 或远程 Linux 服务器）。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s