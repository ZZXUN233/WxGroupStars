# 群星闪耀部署配置
# H5 静态文件目录：/var/www/group-stars
# API 容器：127.0.0.1:3000；API 使用独立子域名，不挂在站点路径下

server {
    listen 80;
    server_name gs.zzxun.cn api.zzxun.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name gs.zzxun.cn;

    ssl_certificate /etc/nginx/certs/acme/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/acme/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    root /var/www/group-stars;
    index index.html;
    client_max_body_size 20M;

    add_header Strict-Transport-Security "max-age=31536000;includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    access_log /var/log/nginx/group-stars.access.log;
    error_log /var/log/nginx/group-stars.error.log;

    location /group-stars/ {
        return 404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name api.zzxun.cn;

    ssl_certificate /etc/nginx/certs/acme/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/acme/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 20M;

    add_header Strict-Transport-Security "max-age=31536000;includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    access_log /var/log/nginx/group-stars-api.access.log;
    error_log /var/log/nginx/group-stars-api.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}